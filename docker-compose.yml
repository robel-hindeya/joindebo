# Run the whole stack on your machine, built from this checkout:
#   docker compose up --build -d     then open http://localhost:8080
# Uses the root .env. Same images and routing as the VPS (deploy/docker-compose.yml),
# but plain http on port 8080 and no password.
#
# Data lives in the Docker volume debo_db, so it survives restarts, rebuilds and
# `docker compose down`. Only `docker compose down -v` deletes it.
# Postgres is on 127.0.0.1:5433 for tools and `npm run dev:api` (5432 is often taken).

x-web: &web
  restart: unless-stopped
  build:
    context: .
    dockerfile: deploy/web.Dockerfile

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: temelash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TC_API_PASSWORD: ${TC_API_PASSWORD:?set TC_API_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - debo_db:/var/lib/postgresql/data
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d temelash"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies new migrations on every start, then exits.
  migrate:
    build:
      context: .
      dockerfile: deploy/migrate.Dockerfile
    environment:
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/temelash
      DATABASE_URL: postgresql://tc_api:${TC_API_PASSWORD}@db:5432/temelash
    depends_on:
      db: { condition: service_healthy }

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on: [api, customer, staff, owner, admin]

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tc_api:${TC_API_PASSWORD}@db:5432/temelash
      API_PORT: 4000
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  customer:
    <<: *web
    build: { context: ., dockerfile: deploy/web.Dockerfile, args: { APP: customer } }
  staff:
    <<: *web
    build: { context: ., dockerfile: deploy/web.Dockerfile, args: { APP: staff } }
  owner:
    <<: *web
    build: { context: ., dockerfile: deploy/web.Dockerfile, args: { APP: owner } }
  admin:
    <<: *web
    build: { context: ., dockerfile: deploy/web.Dockerfile, args: { APP: admin } }

volumes:
  debo_db:
    name: debo_db
